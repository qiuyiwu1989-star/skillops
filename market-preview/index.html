<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="SkillOps 已批准技能的本地能力市场预览">
    <title>SkillOps 能力市场预览</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#market">跳到技能列表</a>
    <header class="site-header">
      <a class="brand" href="./" aria-label="SkillOps 能力市场首页">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>SkillOps</span>
      </a>
      <div class="preview-label">本地只读预览</div>
    </header>

    <main id="market">
      <section class="intro" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">已审核能力</p>
          <h1 id="page-title">可信技能，证据可查</h1>
          <p>这里只展示已批准的技能。每项能力都保留来源、版本、许可、安全与人工审核记录。</p>
        </div>
        <dl class="summary" aria-label="市场摘要">
          <div>
            <dt>已上架</dt>
            <dd id="total-count">-</dd>
          </div>
          <div>
            <dt>可分发正文</dt>
            <dd id="content-count">-</dd>
          </div>
          <div>
            <dt>仅来源链接</dt>
            <dd id="link-count">-</dd>
          </div>
        </dl>
      </section>

      <section class="market-controls" aria-label="技能筛选">
        <label class="field search-field">
          <span>搜索能力</span>
          <input id="search" type="search" autocomplete="off" placeholder="输入名称、说明或来源">
        </label>
        <label class="field filter-field">
          <span>分发范围</span>
          <select id="distribution">
            <option value="all">全部</option>
            <option value="content">可分发正文</option>
            <option value="source_link_only">仅来源链接</option>
          </select>
        </label>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </section>

      <section id="state" class="state-panel" aria-live="polite">
        <div class="skeleton" aria-hidden="true"></div>
        <div class="skeleton short" aria-hidden="true"></div>
        <p>正在读取已批准技能</p>
      </section>
      <section id="listings" class="listing-grid" aria-label="已批准技能" hidden></section>
    </main>

    <footer>
      <p>数据来源固定为 CandidateStore.listListings()</p>
      <p id="generated-at">尚未读取构建时间</p>
    </footer>

    <dialog id="evidence-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p class="dialog-kicker">审核证据</p>
          <h2 id="dialog-title"></h2>
        </div>
        <button id="dialog-close" class="quiet-button" type="button">关闭</button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
    </dialog>
  </body>
</html>
