<!doctype html>
<html lang="zh-CN" data-theme="rams">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="SkillOps 已批准技能的本地能力市场预览">
    <title>SkillOps 能力市场预览</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500&amp;family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css?v=design-system-v1">
    <script src="./app.js?v=design-system-v1" type="module"></script>
  </head>
  <body>
    <a class="skip-link btn sm" href="#market">跳到技能列表</a>

    <header class="site-header">
      <div class="wrap nav-inner">
        <a class="brand" href="./" aria-label="SkillOps 能力市场首页">Skill<span>Ops</span></a>
        <p class="eyebrow preview-label">能力市场 · 本地只读预览</p>
      </div>
    </header>

    <main id="market">
      <section class="intro" aria-labelledby="page-title">
        <div class="wrap intro-grid">
          <div class="intro-copy">
            <p class="eyebrow">trusted skill registry</p>
            <h1 id="page-title" class="h-display">可信技能，<br>证据可查</h1>
            <p class="intro-lead">这里只展示已批准的技能。每项能力都保留来源、版本、许可、安全与人工审核记录。</p>
          </div>
          <dl class="summary" aria-label="市场摘要">
            <div>
              <dt>已上架</dt>
              <dd id="total-count">-</dd>
            </div>
            <div>
              <dt>可分发正文</dt>
              <dd id="content-count">-</dd>
            </div>
            <div>
              <dt>仅来源链接</dt>
              <dd id="link-count">-</dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="market-section" aria-labelledby="market-title">
        <div class="wrap">
          <div class="section-heading">
            <div>
              <p class="eyebrow">approved listings</p>
              <h2 id="market-title" class="h-2">已审核能力</h2>
            </div>
            <p id="result-count" class="result-count mono" aria-live="polite"></p>
          </div>

          <div class="market-controls" aria-label="技能筛选">
            <label class="control-group search-field">
              <span>搜索能力</span>
              <input class="field" id="search" type="search" autocomplete="off" placeholder="输入名称、说明或来源">
            </label>
            <label class="control-group filter-field">
              <span>分发范围</span>
              <select class="field" id="distribution">
                <option value="all">全部</option>
                <option value="content">可分发正文</option>
                <option value="source_link_only">仅来源链接</option>
              </select>
            </label>
          </div>

          <section id="state" class="state-panel" aria-live="polite">
            <div class="skeleton" aria-hidden="true"></div>
            <div class="skeleton short" aria-hidden="true"></div>
            <p>正在读取已批准技能</p>
          </section>
          <section id="listings" class="listing-grid" aria-label="已批准技能" hidden></section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>Skill<span>Ops</span> · 可信能力市场</p>
        <div class="footer-meta mono">
          <p>CandidateStore.listListings()</p>
          <p id="generated-at">尚未读取构建时间</p>
        </div>
      </div>
    </footer>

    <dialog id="evidence-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">verification evidence</p>
          <h2 id="dialog-title" class="h-2"></h2>
        </div>
        <button id="dialog-close" class="btn ghost sm" type="button">关闭</button>
      </div>
      <div id="dialog-content" class="dialog-content"></div>
    </dialog>
  </body>
</html>
