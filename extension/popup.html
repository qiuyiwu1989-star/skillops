<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; font-family: system-ui, 'Noto Sans SC', sans-serif; background: #fbfaf6; color: #161616; }
  .h { padding: 14px 16px; border-bottom: 1px solid #e4e1d8; font: 600 14px system-ui; }
  .h .u { color: #e2522a; }
  .b { padding: 14px 16px; }
  label { display: block; font: 11px ui-monospace, monospace; color: #6b6b63; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #e4e1d8; border-radius: 8px; font: 12px ui-monospace, monospace; outline: none; background: #fff; }
  input:focus { border-color: #e2522a; }
  button.go { margin-top: 10px; padding: 9px 16px; border: 1px solid #e2522a; background: #e2522a; color: #fff; border-radius: 999px; font: 12px system-ui; cursor: pointer; }
  .muted { font: 11px ui-monospace, monospace; color: #a8a69c; line-height: 1.7; margin-top: 10px; }
  .muted a { color: #e2522a; text-decoration: none; }
  .ok { color: #4a9b8a; font: 12px ui-monospace, monospace; }
  .err { color: #d4674a; font: 11px ui-monospace, monospace; margin-top: 8px; }
  .list { max-height: 240px; overflow: auto; margin-top: 10px; border: 1px solid #eeece5; border-radius: 8px; }
  .it { padding: 8px 10px; border-bottom: 1px solid #eeece5; display: flex; gap: 8px; align-items: center; }
  .it:last-child { border-bottom: 0; }
  .it .nm { flex: 1; font: 500 12px system-ui; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .tr { font: 600 11px ui-monospace, monospace; color: #6b6b63; }
  .it .cp { border: 1px solid #e4e1d8; background: none; color: #6b6b63; border-radius: 999px; font-size: 10px; padding: 2px 9px; cursor: pointer; }
  .it .cp:hover { border-color: #e2522a; color: #e2522a; }
</style></head>
<body>
  <div class="h">SkillOps<span class="u">_</span> 技能库</div>
  <div class="b" id="b"></div>
  <script src="popup.js"></script>
</body></html>
